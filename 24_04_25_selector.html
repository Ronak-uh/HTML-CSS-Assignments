<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ronak Chavhan</title>
    <style>
        #top{
            width: 70%;
            background: linear-gradient(145deg,#30E8BF, #FF8235);
            border-radius: 10px;
            margin: 0 auto;
            text-align: center;
        }
        #topname{
            color:transparent;
            background: linear-gradient(135deg , #EB5757, #000000);
            -webkit-background-clip: text;
        }
        #topsname{
            color:transparent;
            background: linear-gradient(135deg , #C33764, #1D2671);
            -webkit-background-clip: text;
        }
    </style>
</head>
<body>
    <div id="top">
        <h1><span id="topname">Ronak</span> <span id="topsname">Chavhan</span></h1>
    </div>
</body>
</html>
