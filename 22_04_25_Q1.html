<!DOCTYPE html>
<html lang="en">
<head>
    <title>Tables</title>
</head>
<body>
    <table style="border: 4px,solid;width: 100%;">
        <caption><h2>Products</h2></caption>
        <thead>
            <tr>
                <th>Product</th>
                <th>Price</th>
                <th>Quantity</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Laptop</td>
                <td>1,30,000</td>
                <td>3</td>
            </tr>
            <tr>
                <td>Smartphone</td>
                <td>80,000</td>
                <td>5</td>
            </tr>
            <tr>
                <td>TV</td>
                <td>75,000</td>
                <td>8</td>
            </tr>
            <tr>
                <td>Moniter</td>
                <td>50,000</td>
                <td>4</td>
            </tr>
            <td>Ps5</td>
            <td>50,000</td>
            <td>6</td>
        </tbody>
        <tfoot>
            <tr>
                <td>Total</td>
                <td>3,85,000</td>
                <td>26</td>
            </tr>
        </tfoot>
    </table>
</body>
