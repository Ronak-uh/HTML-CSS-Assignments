<!DOCTYPE html>
<html lang="en">
<head>
    <title>Tables</title>
</head>
<body>
    <table style="border: 5px,solid;width: 100%;">
        <caption><h2>Hobbies</h2></caption>
        <thead>
            <tr>
                <th>Hobby</th>
                <th>Description</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Gaming</td>
                <td>A thrilling escape into virtual worlds that challenge reflexes and strategy.</td>
            </tr>
            <tr>
                <td>Swimming</td>
                <td>A refreshing full-body workout that builds strength, stamina, and peace of mind.</td>
            </tr>
            <tr>
                <td>Reading</td>
                <td>A creative journey through captivating stories and stunning visuals across cultures.</td>
            </tr>
        </tbody>
    </table>
</body>
