<!DOCTYPE html>
<html lang="en">
<head>
    <title>Tables</title>
</head>
<body>
    <table style="border: 4px,solid;background-color: rgb(37, 209, 77);width: 100%;">
        <caption><h2>Student Marks</h2></caption>
        <thead>
          <tr>
            <th>Name</th>
            <th>Math</th>
            <th>Science</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Ronak</td>
            <td>95</td>
            <td>98</td>
          </tr>
          <tr>
            <td>Mohammad</td>
            <td>88</td>
            <td>91</td>
          </tr>
        </tbody>
        <tfoot>
          <tr>
            <td>Total</td>
            <td>183</td>
            <td>189</td>
          </tr>
        </tfoot>
      </table>
</body>
<style>th,td{
    border: 3px,solid;
    background-color: aqua;}
</style>
