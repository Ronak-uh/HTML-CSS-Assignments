<!DOCTYPE html>
<html lang="en">
<head>
    <title>Tables</title>
</head>
<body>
    <table style="border: 4px,solid;width: 100%;">
        <caption><h2>Time Table</h2></caption>
        <thead>
            <tr>
                <th>Subject</th>
                <th>Monday</th>
                <th>Tuesday</th>
                <th>Wednesday</th>
                <th>Thursday</th>
                <th>Friday</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Maths</td>
                <td>12:00 to 1:30</td>
                <td>1:30 to 3:00</td>
                <td>12:00 to 1:30</td>
                <td>3:00 to 4:30</td>
                <td>1:30 to 3:00</td>
            </tr>
            <tr>
                <td>Science</td>
                <td>1:30 to 3:00</td>
                <td>12:00 to 1:30</td>
                <td>3:00 to 4:30</td>
                <td>12:00 to 1:30</td>
                <td>3:00 to 4:30</td>
            </tr>
        </tbody>
    </table>
</body>
